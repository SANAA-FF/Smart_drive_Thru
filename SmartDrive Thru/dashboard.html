<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kitchen Dashboard | Smart Drive-Thru</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        body {
            background-color: #121212;
            color: var(--pure-white);
        }

        .dashboard-container {
            padding: 40px 20px;
            max-width: 1400px;
            margin: 0 auto;
        }

        .dashboard-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 40px;
            border-bottom: 2px solid #333;
            padding-bottom: 20px;
        }

        .dashboard-header h2 {
            font-size: 2.8rem;
            margin: 0;
            color: var(--pure-white);
        }

        .dashboard-header span {
            color: var(--accent-orange);
        }

        .live-indicator {
            display: flex;
            align-items: center;
            gap: 10px;
            background-color: var(--secondary-black);
            padding: 10px 20px;
            border-radius: 30px;
            border: 1px solid #333;
            font-weight: bold;
            color: var(--accent-yellow);
        }

        .pulsing-dot {
            width: 12px;
            height: 12px;
            background-color: #4CAF50;
            border-radius: 50%;
            box-shadow: 0 0 10px #4CAF50;
            animation: pulse 1.5s infinite;
        }

        /* Orders Grid Layout */
        .orders-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(350px, 1fr));
            gap: 25px;
        }

        .order-card {
            background-color: var(--secondary-black);
            border-radius: 15px;
            padding: 25px;
            border: 1px solid #333;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.5);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            transition: transform var(--transition-speed);
        }

        .order-card:hover {
            border-color: var(--accent-orange);
        }

        .order-card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            border-bottom: 1px solid #333;
            padding-bottom: 12px;
        }

        .order-number {
            font-size: 1.3rem;
            font-weight: bold;
            color: var(--accent-yellow);
            margin: 0;
        }

        .order-plate-badge {
            background-color: var(--primary-black);
            color: var(--pure-white);
            padding: 6px 12px;
            border-radius: 6px;
            font-weight: bold;
            font-size: 0.95rem;
            border: 1px solid var(--accent-orange);
            margin-bottom: 15px;
            display: inline-block;
        }

        .order-timing-details {
            font-size: 0.9rem;
            color: var(--text-muted);
            background-color: var(--primary-black);
            padding: 10px;
            border-radius: 8px;
            margin-bottom: 15px;
            border: 1px solid #222;
        }

        .order-timing-details div {
            margin-bottom: 4px;
        }

        .order-items-list {
            list-style: none;
            padding: 0;
            margin: 0 0 20px 0;
            max-height: 140px;
            overflow-y: auto;
        }

        .order-item-row {
            display: flex;
            justify-content: space-between;
            font-size: 1rem;
            margin-bottom: 6px;
            color: var(--text-muted);
        }

        .order-item-row span:first-child {
            color: var(--pure-white);
        }

        .order-actions {
            display: flex;
            gap: 10px;
        }

        .action-btn {
            flex: 1;
            padding: 10px;
            font-weight: bold;
            border-radius: 8px;
            border: none;
            cursor: pointer;
            transition: opacity var(--transition-speed);
        }

        .action-btn:hover {
            opacity: 0.9;
        }

        .btn-ready {
            background-color: #4CAF50;
            color: var(--pure-white);
        }

        .btn-clear {
            background-color: #333;
            color: var(--text-muted);
        }
        .stats-container{

display:grid;
grid-template-columns:repeat(4,1fr);
gap:20px;
margin-bottom:30px;

}

.stat-card{

background:#1f1f1f;
padding:20px;
border-radius:12px;
text-align:center;
border:1px solid #333;

}

.stat-card h2{

font-size:38px;
color:#ff9800;
margin:0;

}

.stat-card p{

margin-top:10px;
color:white;

}
        .status-tag {
            font-weight: bold;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 0.8rem;
        }

        .status-tag.preparing {
            background-color: rgba(255, 193, 7, 0.2);
            color: var(--accent-yellow);
        }

        .status-tag.ready {
            background-color: rgba(76, 175, 80, 0.2);
            color: #4CAF50;
        }

        @keyframes pulse {
            0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(76, 175, 80, 0.7); }
            70% { transform: scale(1.05); box-shadow: 0 0 0 10px rgba(76, 175, 80, 0); }
            100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(76, 175, 80, 0); }
        }
        .arrived-card{
             border:3px solid #00ff66;
            
        }
        .action-btn{

    width:100%;
    padding:12px;
    margin-top:15px;
    border:none;
    border-radius:8px;
    background:#ff9800;
    color:white;
    font-size:16px;
    cursor:pointer;
    font-weight:bold;

}

.action-btn:hover{

    background:#e68900;

}

        
    </style>
</head>
<body>
    <div class="dashboard-header">
    <h2>Kitchen <span>Dashboard</span></h2>

    <div class="live-indicator">
        <div class="pulsing-dot"></div>
        Live Queue (FIFO)
    </div>
</div>

<!-- Statistics Cards -->
<div class="stats-container">

    <div class="stat-card">
        <h2 id="pendingCount">0</h2>
        <p>Pending</p>
    </div>

    <div class="stat-card">
        <h2 id="preparingCount">0</h2>
        <p>Preparing</p>
    </div>

    <div class="stat-card">
        <h2 id="readyCount">0</h2>
        <p>Ready</p>
    </div>

    <div class="stat-card">
        <h2 id="completedCount">0</h2>
        <p>Completed</p>
    </div>

</div>

<div class="orders-grid" id="dashboardOrdersContainer">
            <!-- Dynamic orders populated here -->
        </div>
    </div>

    <script type="module" src="js/dashboard.js"></script>
</body>
</html>
